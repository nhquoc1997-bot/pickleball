name: Validate YOLO Pickleball
on:
  push:
    branches:
      - main
      - feat/yolo-gameplay-v2
      - feat/yolo-rigged-athletes-v3
      - feat/yolo-pickleball-motion-v4
      - feat/yolo-pickleball-gameplay-v5
      - feat/yolo-pickleball-network-v6
      - feat/yolo-pickleball-rules-v7
      - feat/yolo-pickleball-ai-v8
      - feat/yolo-pickleball-motion-v9
      - feat/yolo-pickleball-network-v10
      - feat/yolo-pickleball-stats-v11
      - feat/yolo-pickleball-mobile-v12
      - feat/yolo-pickleball-simulation-v13
  pull_request:
    branches:
      - main
jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate JavaScript module syntax
        run: |
          node --input-type=module --check < src/main.js
          node --input-type=module --check < src/avatar-rig.js
          node --input-type=module --check < src/rules.mjs
          node --input-type=module --check < src/ai-strategy.mjs
          node --input-type=module --check < src/motion-profile.mjs
          node --input-type=module --check < src/room-state.mjs
          node --input-type=module --check < src/stats.mjs
          node --input-type=module --check < src/performance-budget.mjs
          node --input-type=module --check < src/simulation-clock.mjs
      - name: Verify app entry points and import map
        run: |
          test -s index.html
          test -s styles.css
          test -s src/main.js
          test -s src/avatar-rig.js
          test -s src/rules.mjs
          test -s tests/rules.test.mjs
          test -s tests/ai-strategy.test.mjs
          test -s tests/motion-profile.test.mjs
          test -s src/room-state.mjs
          test -s tests/room-state.test.mjs
          test -s src/stats.mjs
          test -s tests/stats.test.mjs
          test -s src/performance-budget.mjs
          test -s tests/performance-budget.test.mjs
          test -s src/simulation-clock.mjs
          test -s tests/simulation-clock.test.mjs
          test -s THIRD_PARTY_NOTICES.md
          grep -q 'src/main.js' index.html
          grep -q 'avatar-rig.js' src/main.js
          grep -q 'type="importmap"' index.html
          grep -q 'styles.css' index.html
          grep -q 'function serializePlayers' src/main.js
          grep -q 'seq: ++S.snapshotSeq' src/main.js
          grep -q 'message.type === "ping"' src/main.js
          grep -q 'message.type === "pong"' src/main.js
          grep -q 'isValidServeLanding' src/main.js
          grep -q 'nextServeState' src/main.js
          grep -q 'ballBouncedSinceHit' src/main.js
          grep -q 'scoreCallLabel' index.html
          grep -q 'assignDoublesRoles' src/main.js
          grep -q 'chooseBotShot' src/main.js
          grep -q 'shouldBotContestBall' src/main.js
          grep -q 'getFootworkProfile' src/avatar-rig.js
          grep -q 'updateCamera(dt)' src/main.js
          grep -q 'findResumablePlayer' src/main.js
          grep -q 'scheduleReconnect' src/main.js
          grep -q 'reconnectButton' index.html
          grep -q 'connected: p.connected' src/main.js
          grep -q 'buildMatchReport' src/main.js
          grep -q 'playerStats: S.playerStats' src/main.js
          grep -q 'careerMatches' index.html
          grep -q 'matchStatsContent' index.html
          grep -q 'getRenderProfile' src/main.js
          grep -q 'nextRenderQuality' src/main.js
          grep -q 'pointerType !== "mouse"' src/main.js
          grep -q 'touch-action:none' styles.css
          grep -q 'advanceFixedSteps' src/main.js
          grep -q 'limitPlayerInput' src/main.js
          grep -q 'S.physicsAccumulator' src/main.js
          node --test tests/rules.test.mjs
          node --test tests/ai-strategy.test.mjs
          node --test tests/motion-profile.test.mjs
          node --test tests/room-state.test.mjs
          node --test tests/stats.test.mjs
          node --test tests/performance-budget.test.mjs
          node --test tests/simulation-clock.test.mjs
