name: Validate YOLO Pickleball
on:
  push:
    branches:
      - main
      - feat/yolo-gameplay-v2
  pull_request:
    branches:
      - main
jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate JavaScript module syntax
        run: node --input-type=module --check < src/main.js
      - name: Verify app entry points
        run: |
          test -s index.html
          test -s styles.css
          test -s src/main.js
          grep -q 'src/main.js' index.html
          grep -q 'styles.css' index.html
